name: DocFlow CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/docflow_ci
      JWT_SECRET: ci_only_jwt_secret_with_at_least_32_characters
      OTP_SECRET: ci_only_otp_secret_with_at_least_32_characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run qa
        working-directory: server
      - name: Care assistant invariants (deterministic fallback, no model needed)
        run: npm run qa:ai
        working-directory: server
        env:
          AI_ASSISTANT: "false"
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: client
      - run: npm run dev -- --host 127.0.0.1 > /tmp/docflow-vite.log 2>&1 &
        working-directory: client
      - run: for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:5173 && exit 0; sleep 1; done; exit 1
      - run: npm run qa:ui
        working-directory: client
        env:
          CHROME_PATH: /usr/bin/google-chrome
